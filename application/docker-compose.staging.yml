services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: ced-staging-app
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      - APP_ENV=staging
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-ced_staging}
      - DB_USERNAME=${DB_USERNAME:-ced_user}
      - DB_PASSWORD=${DB_PASSWORD:-ced_secret_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
    volumes:
      - ced_staging_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ced-staging-net

  web:
    image: nginx:1.25-alpine
    container_name: ced-staging-web
    restart: unless-stopped
    ports:
      - "${STAGING_WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ced_staging_storage:/var/www/html/storage:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ced-staging-net

  db:
    image: mariadb:10.11-jammy
    container_name: ced-staging-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ced_staging_root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-ced_staging}
      MYSQL_USER: ${DB_USERNAME:-ced_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ced_secret_password}
    volumes:
      - ced_staging_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ced-staging-net

  redis:
    image: redis:7-alpine
    container_name: ced-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ced_staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ced-staging-net

networks:
  ced-staging-net:
    driver: bridge

volumes:
  ced_staging_db_data:
    driver: local
  ced_staging_redis_data:
    driver: local
  ced_staging_storage:
    driver: local
